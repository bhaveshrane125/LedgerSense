dataset:
  name: ledgersense_synthetic_v1
  pdf_count: 200
  output_directory: output/realistic_order_docs_200
  seed: 42

master_data:
  locale: en_IN
  currency: INR
  vendor_count: 15
  item_count: 80

invoice:
  min_line_items: 2
  max_line_items: 9
  layouts:
    - MODERN
    - CLASSIC
    - COMPACT
    - INDUSTRIAL
    - MINIMAL

scenarios:
  CLEAN: 0.25
  PRICE_VARIANCE_OVER: 0.15
  QTY_OVER_BILLED: 0.15
  MISSING_GRN: 0.1
  UOM_MISMATCH: 0.08
  DUPLICATE_CONFIRMED: 0.04
  ARITHMETIC_ERROR: 0.04
  PARTIAL_RECEIPT: 0.08
  WRONG_ITEM_DELIVERED: 0.06
  ITEMS_MISSING: 0.05

rendering:
  add_noise: false
  add_rotation: false
  render_po_pdfs: true
  render_grn_pdfs: true
